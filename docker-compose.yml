version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: thepapare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: thepapare_events
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: thepapare-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/thepapare_events
      SESSION_SECRET: production_session_secret_change_me
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongodb

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: thepapare-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_SITE_URL: http://localhost:3000
      PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      API_INTERNAL_URL: http://api:5000
    depends_on:
      - api

volumes:
  mongo_data:

